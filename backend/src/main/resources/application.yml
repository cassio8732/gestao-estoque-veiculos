spring:
  application:
    name: estoque-veiculos
  profiles:
    active: dev

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # Arquivo novo evita conflito com schema antigo (modelos.marca_id). Ver backend/scripts/reset-db.sh
    url: jdbc:h2:file:./data/estoque;MODE=MySQL;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      # Recria tabelas a partir das entidades (sem migração quebrada do schema anterior)
      ddl-auto: create
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8081

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    try-it-out-enabled: true
  api-docs:
    path: /api-docs
  show-actuator: false

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:estoque_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
